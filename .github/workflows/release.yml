name: Open Neo TTS Releases
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      incremento:
        description: Incremento de versión
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
permissions:
  contents: read
concurrency:
  group: open-neo-release
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.next.outputs.tag }}
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: next
        env:
          BUMP: ${{ inputs.incremento || 'patch' }}
        run: |
          set -euo pipefail
          git fetch --tags
          current="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          if [ -z "$current" ]; then
            next=0.1.0
          else
            IFS=. read -r major minor patch <<< "$current"
            major="$(printf '%s' "$major" | sed 's/^v//')"
            case "$BUMP" in
              major) next="$((major+1)).0.0" ;;
              minor) next="$major.$((minor+1)).0" ;;
              patch) next="$major.$minor.$((patch+1))" ;;
              *) exit 1 ;;
            esac
          fi
          echo "tag=v$next" >> "$GITHUB_OUTPUT"
          echo "version=$next" >> "$GITHUB_OUTPUT"
  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build g++ libssl-dev libjson-c-dev libespeak-ng-dev
      - name: ONNX Runtime
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://github.com/microsoft/onnxruntime/releases/download/v1.22.0/onnxruntime-linux-x64-1.22.0.tgz -o /tmp/ort.tgz
          mkdir -p /tmp/ort
          tar -xzf /tmp/ort.tgz -C /tmp/ort
      - name: Compilar y probar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_NEO_VERSION="${{ needs.version.outputs.version }}" \
            -DNEO_ORT_INCLUDE=/tmp/ort/onnxruntime-linux-x64-1.22.0/include \
            -DNEO_ORT_LIBRARY=/tmp/ort/onnxruntime-linux-x64-1.22.0/lib/libonnxruntime.so
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          test ! -f src/trainer.cpp
          test ! -d src/studio
          test -x build/open-neo-lite
          test -x build/oneo-compiler
      - name: Paquete Linux
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error
  windows:
    needs: version
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-json-c
            mingw-w64-ucrt-x86_64-espeak-ng
            mingw-w64-ucrt-x86_64-onnxruntime
            mingw-w64-ucrt-x86_64-python
            zip
      - name: Compilar y probar
        shell: msys2 {0}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOPEN_NEO_VERSION="$VERSION" \
            -DNEO_ORT_INCLUDE=/ucrt64/include/onnxruntime \
            -DNEO_ORT_LIBRARY=/ucrt64/lib/libonnxruntime.dll.a
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
      - name: Paquete Windows
        shell: msys2 {0}
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/package-windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: github.event_name != 'pull_request'
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-x64'
          path: dist
          merge-multiple: true
      - name: Publicar tag y Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          TARGET: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          gh release create "$TAG" *.tar.gz *.zip SHA256SUMS.txt \
            --repo "$GH_REPO" --target "$TARGET" \
            --title "Open Neo TTS $TAG" --generate-notes
